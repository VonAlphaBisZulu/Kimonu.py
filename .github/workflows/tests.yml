name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # straindesign from GitHub main until RationalMatrix.from_fractions is released (after 1.19.1)
        run: |
          pip install -r binder/requirements.txt pytest nbconvert ipykernel
          pip install --no-deps .
      - name: Tests
        run: pytest -q
      - name: Examples notebook runs
        run: jupyter nbconvert --to notebook --execute --stdout examples/kimonu_examples.ipynb > /dev/null
