[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kimonu"
version = "0.0.1"
description = "Concordance, kinetic modules, ACR and ACRR of metabolic networks from exact sparse nullspaces"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Philipp Schneider" }]
keywords = ["metabolic-networks", "concordance", "kinetic-modules", "ACR", "nullspace", "cobra", "systems-biology"]
# Pure-Python; a Julia toolchain is deliberately NOT required.
dependencies = [
  # exact sparse nullspace from straindesign (straindesign.compression.nullspace, RationalMatrix.from_fractions)
  "straindesign>=1.19.2",
  "cobra>=0.26",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/VonAlphaBisZulu/Kimonu.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
