[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kimonu"
version = "0.0.1"
description = "Exact, deterministic detection of concordance and kinetic modules in metabolic networks via sparse exact nullspace"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Philipp Schneider" }]
keywords = ["metabolic-networks", "concordance", "kinetic-modules", "ACR", "nullspace", "cobra", "systems-biology"]
# Pure-Python; a Julia toolchain is deliberately NOT required.
dependencies = [
  # exact sparse nullspace comes from straindesign (straindesign.sparse_nullspace);
  # public API since 1.19.
  "straindesign>=1.19.2",
  "cobra>=0.26",
]

[project.optional-dependencies]
# symbolic_formulas only
symbolic = ["sympy>=1.12"]
dev = ["pytest>=7", "sympy>=1.12"]

[project.urls]
Homepage = "https://github.com/VonAlphaBisZulu/Kimonu.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
